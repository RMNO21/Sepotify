<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- High-Luminance Neon Emerald Gradient -->
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2af598" />
      <stop offset="50%" stop-color="#1ed760" />
      <stop offset="100%" stop-color="#14c752" />
    </linearGradient>

    <!-- Outer Arc Accent Gradient -->
    <linearGradient id="outerRingGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2af598" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#14c752" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Solid Black Background with Rounded Corners -->
  <rect width="512" height="512" rx="100" fill="#000000" />

  <!-- Outer Broken Circle: 3 Segmented Circular Arcs -->
  <g transform="rotate(-15 256 256)">
    <!-- Arc 1 (Top-Right) -->
    <path d="M 397 114 A 200 200 0 0 1 454 278" fill="none" stroke="url(#outerRingGreen)" stroke-width="16" stroke-linecap="round" />
    <!-- Arc 2 (Bottom) -->
    <path d="M 379 412 A 200 200 0 0 1 146 422" fill="none" stroke="url(#outerRingGreen)" stroke-width="16" stroke-linecap="round" />
    <!-- Arc 3 (Top-Left) -->
    <path d="M 83 298 A 200 200 0 0 1 200 68" fill="none" stroke="url(#outerRingGreen)" stroke-width="16" stroke-linecap="round" />
  </g>

  <!-- Audio Waveform Bars (Vertical, Rounded, Neon Glow Look) -->
  <!-- Bar 1 (Left): Center X=180, Height=100 -->
  <rect x="166" y="206" width="28" height="100" rx="14" fill="url(#neonGreen)" />

  <!-- Bar 2 (Mid-Left): Center X=230, Height=190 -->
  <rect x="216" y="161" width="28" height="190" rx="14" fill="url(#neonGreen)" />

  <!-- Bar 3 (Mid-Right): Center X=282, Height=140 -->
  <rect x="268" y="186" width="28" height="140" rx="14" fill="url(#neonGreen)" />

  <!-- Bar 4 (Right): Center X=332, Height=70 -->
  <rect x="318" y="221" width="28" height="70" rx="14" fill="url(#neonGreen)" />
</svg>
